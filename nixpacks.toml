# Railway usa Nixpacks para decidir con qué construir el proyecto. Sin este
# archivo detecta la raíz —que no tiene package.json— y no sabe qué hacer.
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  # El backend corre en producción y no tiene dependencias de desarrollo.
  "npm --prefix backend ci --omit=dev",
  # El frontend SÍ las necesita, aunque NODE_ENV diga production.
  #
  # Con NODE_ENV=production, `npm ci` se salta las devDependencies — y vite,
  # que es quien COMPILA la interfaz, vive ahí. Sin --include=dev el build
  # muere con "vite: not found", que suena a que falta instalar algo cuando en
  # realidad npm decidió no instalarlo a propósito.
  #
  # Son herramientas de compilación: se usan aquí y no viajan al contenedor
  # final, que solo sirve los archivos ya compilados.
  "npm --prefix frontend ci --include=dev",
]

[phases.build]
cmds = ["npm --prefix frontend run build"]

[start]
cmd = "npm --prefix backend run start:nube"
