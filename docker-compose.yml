# PostgreSQL local para desarrollo, si no quieres instalarlo en tu máquina.
#
#   docker compose up -d
#   cd backend && npm run db:setup
#
# La base queda en localhost:5432 con estos datos, que son los mismos que trae
# .env.example. No usar en producción: la contraseña está escrita aquí.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sgc-postgres
    environment:
      POSTGRES_DB: sgc_compras
      POSTGRES_USER: sgc
      POSTGRES_PASSWORD: sgc_local
    ports:
      - "5432:5432"
    volumes:
      - sgc_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgc -d sgc_compras"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sgc_datos:
