# Opcional: levanta un SQL Server local sin instalar nada.
# Útil en Linux y Mac. En Windows suele ser más cómodo instalar
# SQL Server Express directamente (ver README §2).
#
#   docker compose up -d
#   # crear la base una sola vez:
#   docker exec -it sgc-sqlserver /opt/mssql-tools18/bin/sqlcmd \
#     -S localhost -U sa -P 'Sgc#Local2026' -C -Q "CREATE DATABASE SGC_COMPRAS"
#   cd backend && npm run db:setup
#
# La contraseña de abajo es solo para desarrollo local.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sgc-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sgc#Local2026"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sgc_sqldata:/var/opt/mssql

volumes:
  sgc_sqldata:
